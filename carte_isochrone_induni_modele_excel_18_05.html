function normalize(s) {
  return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function fmt(v, decimals=2) {
  if (v === '' || v === null || v === undefined) return '';
  const n = Number(v);
  return isNaN(n) ? v : n.toLocaleString('fr-CH', {minimumFractionDigits:decimals, maximumFractionDigits:decimals});
}
function materialRecords() {
  if (!selectedMaterial) return [];

function communeRecords() {
  if (!selectedMaterial || !selectedCommune) return [];

}

function getZoneForPoint(lat, lng) {
  const pt = turf.point([lng, lat]);
  for (let i=0; i<isochroneFeatures.length; i++) {
    try {
      if (turf.booleanPointInPolygon(pt, isochroneFeatures[i])) {
        return ZONES.find(z => z.sec === isochroneFeatures[i].properties.value) || null;
      }
    } catch(e) {}
  }
  return null;
}

function buildHistoryPopup(records, commune, zone) {
  let html = '<div style="font-family:DM Sans,sans-serif;min-width:620px;max-width:780px;">' +
    '<div style="font-size:12px;color:#999;margin-bottom:4px;">📍 ' + commune.communeKey + '</div>' +
    '<div style="font-size:16px;font-weight:700;color:' + (zone ? zone.color : '#c0392b') + ';">' + (zone ? 'Zone ' + zone.zone + ' · ' + zone.min + ' min' : 'Hors isochrone') + '</div>' +
    '<div style="font-size:12px;color:#555;margin:8px 0 4px 0;"><b>Matériau :</b> ' + selectedMaterial + '</div>';

  if (!records.length) {
    html += '<div class="history-card">Aucun historique trouvé pour cette commune et ce matériau.</div></div>';
    return html;
  }

  // Regroupement : même matériau + chantier + prix + fournisseur + type + unité
  const groupedMap = new Map();
  records.forEach(r => {
    const priceKey = (r.price === '' || r.price === null || r.price === undefined) ? '' : Number(r.price).toFixed(4);
    const key = [
      r.material || '',
      r.chantier || '',
      priceKey,
      r.currency || '',
      r.supplier || '',
      r.deliveryType || '',
      r.qtyUnit || ''
    ].join('||');

    if (!groupedMap.has(key)) {
      groupedMap.set(key, {
        material: r.material,
        chantier: r.chantier,
        price: r.price,
        currency: r.currency,
        supplier: r.supplier,
        deliveryType: r.deliveryType,
        qtyUnit: r.qtyUnit,
        quantity: 0,
        dates: new Set(),
        count: 0
      });
    }

    const g = groupedMap.get(key);
    const q = Number(r.quantity);
    if (!isNaN(q)) g.quantity += q;
    if (r.date) g.dates.add(r.date);
    g.count += 1;
  });

  const grouped = Array.from(groupedMap.values());

  html += '<div class="history-summary">' + grouped.length + ' ligne(s) regroupée(s) · ' + records.length + ' ligne(s) historique(s) d’origine</div>';
  html += '<div class="history-table-wrap"><table class="history-table">' +
    '<thead><tr>' +
      '<th>Prix unitaire</th>' +
      '<th>Type</th>' +
      '<th>Tonnage total</th>' +
      '<th>Fournisseur</th>' +
      '<th>Date(s) prix</th>' +
      '<th>Chantier</th>' +
    '</tr></thead><tbody>';

  grouped.forEach(g => {
    const price = g.price === '' ? '—' : fmt(g.price, 2) + ' ' + (g.currency || 'CHF');
    const qty = fmt(g.quantity, 2) + ' ' + (g.qtyUnit || '');
    const type = g.deliveryType || '—';
    const dates = Array.from(g.dates).join(' / ') || '—';
    html += '<tr>' +
      '<td class="num">' + price + '</td>' +
      '<td><span class="type-badge">' + type + '</span></td>' +
      '<td class="num">' + qty + (g.count > 1 ? '<div class="group-note">' + g.count + ' lignes</div>' : '') + '</td>' +
      '<td class="supplier">' + (g.supplier || '—') + '</td>' +
      '<td class="date">' + dates + '</td>' +
      '<td class="chantier">' + (g.chantier || '—') + '</td>' +
    '</tr>';
  });

  html += '</tbody></table></div></div>';
  return html;
}

async function geocodeCommune(commune) {
  const query = commune.postal + ' ' + commune.city + ', Switzerland';
  const url = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query) + '&countrycodes=ch&limit=1&addressdetails=1';
  const resp = await fetch(url);
  const arr = await resp.json();
  if (!arr || !arr.length) return null;
  return { lat: parseFloat(arr[0].lat), lon: parseFloat(arr[0].lon), label: arr[0].display_name };
}

async function fetchSwissBorder() {
  try {
    const resp = await fetch('https://raw.githubusercontent.com/ZHB/switzerland-geojson/master/country/switzerland.geojson');
    if (resp.ok) {
      const data = await resp.json();
      return data.type === 'FeatureCollection' ? data.features[0] : data;
    }
  } catch(e) {}
  return null;
}
async function getIsochroneData() {
  try {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed && parsed.features && parsed.features.length) return parsed;
    }
  } catch(e) {}
  const response = await fetch('https://api.openrouteservice.org/v2/isochrones/driving-hgv', {
    method:'POST',
    headers: { 'Authorization': ORS_API_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({
      locations:[[CENTER_LNG, CENTER_LAT]],
      range: ZONES.map(z => z.sec),
      range_type:'time',
      smoothing:1,
      area_units:'km',
      attributes:['area','total_pop']
    })
  });
  if (!response.ok) throw new Error('API ORS erreur ' + response.status + ': ' + await response.text());
  const data = await response.json();
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch(e) {}
  return data;
}
function renderIsochrones(data, swissBorder) {
  if (swissBorder) {
    data.features = data.features.map(f => {
      try {
        const clipped = turf.intersect(turf.featureCollection([f, swissBorder]));
        if (clipped) { clipped.properties = f.properties; return clipped; }
      } catch(e) {}
      return f;
    });
  }
  const features = data.features.sort((a,b) => a.properties.value - b.properties.value);
  isochroneFeatures = features.slice();
  const rings = [];
  for (let i=0; i<features.length; i++) {
    const zone = ZONES.find(z => z.sec === features[i].properties.value);
    if (!zone) continue;
    let ringGeo = features[i];
    if (i > 0) {
      try { ringGeo = turf.difference(turf.featureCollection([features[i], features[i-1]])); } catch(e) { ringGeo = features[i]; }
    }
    if (ringGeo) rings.push({ geo:ringGeo, zone });
  }
  rings.slice().reverse().forEach(ring => {
    const geom = ring.geo.geometry;
    const allRings = [];
    if (geom.type === 'Polygon') allRings.push(geom.coordinates[0].map(c => [c[1], c[0]]));
    else if (geom.type === 'MultiPolygon') geom.coordinates.forEach(poly => allRings.push(poly[0].map(c => [c[1], c[0]])));
    const poly = L.polygon(allRings, {
      color:ring.zone.color, weight:2, opacity:.7, fillColor:ring.zone.color, fillOpacity:ring.zone.fillOpacity
    }).addTo(map).bindPopup('<b style="color:' + ring.zone.color + '">Zone ' + ring.zone.zone + '</b><br>⏱ ' + ring.zone.min + ' minutes depuis INDUNI Petit-Lancy');
  });
  const last = features[features.length-1];
  let pts = [];
  if (last.geometry.type === 'MultiPolygon') last.geometry.coordinates.forEach(p => p[0].forEach(c => pts.push([c[1], c[0]])));
  else pts = last.geometry.coordinates[0].map(c => [c[1], c[0]]);
  map.fitBounds(L.polygon(pts).getBounds().pad(.08));
}
async function init() {
  const status = document.getElementById('status');
  try {
    status.innerHTML = '<span class="spinner"></span>Chargement isochrones depuis INDUNI Petit-Lancy...';
    const border = await fetchSwissBorder();
    if (border) {
      const rings = border.geometry.type === 'Polygon' ? [border.geometry.coordinates[0]] : border.geometry.coordinates.map(p => p[0]);
      rings.forEach(r => L.polyline(r.map(c => [c[1], c[0]]), {color:'#c0392b', weight:2, opacity:.35, dashArray:'8,5'}).addTo(map));
    }
    const iso = await getIsochroneData();
    renderIsochrones(iso, border);
    const badge = document.createElement('div');
    badge.className = 'panel source-badge';
    badge.innerHTML = '<strong>✓ Données historiques filtrées</strong><br>Données mises à jour depuis le fichier Excel du 18.05 : seules les communes avec besoin réel passé sont affichées.<br>Isochrones HGV depuis INDUNI Petit-Lancy.';
    document.body.appendChild(badge);
    status.style.opacity = '0';
    setTimeout(() => status.remove(), 500);
  } catch(err) {
    console.error(err);
    status.innerHTML = '<strong style="color:#c0392b;">Erreur</strong><br>' + err.message + '<br><small>Vérifier la connexion / clé ORS.</small>';
  }
}
init();
</script>
